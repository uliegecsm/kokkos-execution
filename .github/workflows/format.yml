on:
  workflow_call:
    inputs:
      CI_IMAGE:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  clang:
    runs-on: [self-hosted, linux, docker, amd64]
    container:
      image: ${{ inputs.CI_IMAGE }}:clang-OpenMP
    steps:
      - uses: actions/checkout@v6
      - run: bash clang-format.sh
