name: PR agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
    # Do not run if the event is triggered by a bot, such as dependabot.
    if: ${{ github.event.sender.type != 'Bot' }}
    # Run with a self-hosted runner that can access our Ollama service.
    runs-on: [self-hosted, linux, docker, amd64]
    steps:
      - run: wget -vvv ${{ secrets.OLLAMA_API_BASE }} && cat index.html
      - name: Test Ollama from container
        run: |
          docker run --rm --network=host curlimages/curl \
            curl -s ${{ secrets.OLLAMA_API_BASE }}
      - name: Test Ollama from container
        run: |
          docker run --rm curlimages/curl \
            curl -s ${{ secrets.OLLAMA_API_BASE }}
      - uses: the-pr-agent/pr-agent@v0.34
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set the model to a local Ollama model.
          config.model: "ollama/qwen2.5-coder:32b"
          config.fallback_models: '["ollama/qwen2.5-coder:32b"]'
          config.custom_model_max_tokens: "128000"
          # Ollama configuration.
          OLLAMA.API_BASE: ${{ secrets.OLLAMA_API_BASE }}
          # Tool configuration.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          # Configure which PR events trigger the action.
          github_action_config.pr_actions: "[opened, reopened, ready_for_review, review_requested, synchronize]"
